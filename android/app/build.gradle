plugins { id 'com.android.application' }

android {
    namespace 'app.suryacount'
    compileSdk 36

    defaultConfig {
        applicationId 'app.suryacount'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['task', 'wasm'] }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
