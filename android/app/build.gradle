plugins { id 'com.android.application' }

android {
    namespace 'app.suryacount'
    compileSdk 36

    defaultConfig {
        applicationId 'app.suryacount'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }
    // Test builds are all signed with the same key kept in the repository, so a newer test build installs
    // over an older one without uninstalling. This key is public and is NOT the Play Store key.
    signingConfigs {
        debug {
            storeFile rootProject.file('test-key.jks')
            storePassword 'testbuild'
            keyAlias 'test'
            keyPassword 'testbuild'
        }
    }
    buildTypes {
        // Test builds are not debuggable, so the app's stored data cannot be read out with developer tools.
        debug { debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['task', 'wasm'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
