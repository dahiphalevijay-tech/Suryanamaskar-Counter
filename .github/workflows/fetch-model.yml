name: Store pose model

# Keeps copies of the pose-detection models (lite and full) on the "model" branch so builds and tests do not depend on an outside download.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-model.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - name: Download and store
        run: |
          set -euo pipefail
          mkdir model && cd model
          for m in lite full; do
            curl --fail --location --silent --show-error -o pose_landmarker_$m.task \
              https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task
          done
          git init -q -b model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Pose landmarker lite model"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" model
