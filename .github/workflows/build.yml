name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDIAPIPE_VERSION: 1.2.2
  MODEL_BASE: https://storage.googleapis.com/mediapipe-models/pose_landmarker

jobs:
  web:
    name: Test and prepare the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run counting tests
        run: node tests/counter.test.mjs && node tests/stats.test.mjs && node tests/person.test.mjs && node tests/plan.test.mjs && node tests/speech.test.mjs && node tests/form.test.mjs
      - name: Fetch the pose detector
        run: |
          set -euo pipefail
          mkdir -p web/vendor/tasks-vision tmp
          cd tmp
          npm pack "@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}"
          tar xzf mediapipe-tasks-vision-*.tgz
          cp package/vision_bundle.mjs ../web/vendor/tasks-vision/vision_bundle.js
          cp -r package/wasm ../web/vendor/tasks-vision/wasm
          for m in lite full; do
            curl --fail --location --silent --show-error -o ../web/vendor/pose_landmarker_$m.task "$MODEL_BASE/pose_landmarker_$m/float16/latest/pose_landmarker_$m.task"
            test "$(stat -c %s ../web/vendor/pose_landmarker_$m.task)" -gt 1000000
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: web

  android:
    name: Build the Android app
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: android/app/src/main/assets/web
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.11.1
      - name: Build test APK
        env:
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$TEST_KEY_PASSWORD" ]; then echo "TEST_KEY_PASSWORD secret is missing"; exit 1; fi
          gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suryanamaskar-counter-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk suryanamaskar-counter-test.apk
          gh release delete test-build --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create test-build suryanamaskar-counter-test.apk --repo "$GITHUB_REPOSITORY" \
            --title "Test build" --notes "Latest test build for trying the app on your own phone. Not the Play Store version." --prerelease
          # once the release was left as a draft (download link gave 404): make sure it is published
          for i in 1 2 3; do
            [ "$(gh release view test-build --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "false" ] && break
            sleep 5; gh release edit test-build --draft=false --repo "$GITHUB_REPOSITORY" || true
          done
          [ "$(gh release view test-build --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "false" ]
