name: Make voices

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: List the sentences
        run: node tools/voice_lines.mjs > voice-lines.json
      - name: Make sure ffmpeg is there
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Record the clips
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python3 tools/make_voices.py voice-lines.json
      - name: Save the clips in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/audio
          git diff --cached --quiet || git commit -m "Update recorded voice clips"
          git push
      - name: Build the app with the new clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
